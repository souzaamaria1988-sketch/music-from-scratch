name: Generate Music
on:
  workflow_dispatch:
    inputs:
      style:
        description: 'Estilo: random, calm, tense, epic, chaotic'
        default: 'epic'
      length:
        description: 'Tokens'
        default: '512'
      bpm:
        description: 'BPM'
        default: '120'
      seed:
        description: 'Seed (vazio = aleatorio)'
        default: ''
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system
        run: sudo apt-get update && sudo apt-get install -y fluidsynth ffmpeg
      - name: Install python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Generate
        env:
          PYTHONUNBUFFERED: 1
        run: |
          SEED_ARG=''
          if [ -n '${{ github.event.inputs.seed }}' ]; then SEED_ARG='--seed ${{ github.event.inputs.seed }}'; fi
          python generate.py --ckpt models/best.pt --prompt-style ${{ github.event.inputs.style }} --length ${{ github.event.inputs.length }} --bpm ${{ github.event.inputs.bpm }} $SEED_ARG --out outputs --soundfonts soundfonts
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: outputs/
          retention-days: 30
      - name: Commit generated
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          mkdir -p generated
          cp outputs/*.mid outputs/*.wav outputs/*.mp3 generated/ 2>/dev/null || true
          git add generated/ || true
          git commit -m 'New track [skip ci]' || echo 'no changes'
          git push || echo 'no push'