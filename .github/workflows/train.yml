name: Train From Scratch
on:
  workflow_dispatch:
    inputs:
      midi_count:
        description: 'MIDIs auto-gerados'
        default: '800'
      epochs:
        description: 'Epocas'
        default: '40'
      block:
        description: 'Block size'
        default: '256'
      d_model:
        description: 'd_model'
        default: '256'
      render_audio:
        description: 'Renderizar WAV? (true/false)'
        default: 'true'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system
        run: sudo apt-get update && sudo apt-get install -y fluidsynth ffmpeg
      - name: Install python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Self-generate MIDI
        run: python self_gen.py --out training_data/midi --count ${{ github.event.inputs.midi_count }} --bars 8
      - name: Render audio
        if: ${{ github.event.inputs.render_audio == 'true' }}
        run: python render_all.py --midi training_data/midi --out training_data/audio --soundfonts soundfonts
      - name: Tokenize
        run: python dataset.py --midi training_data/midi --out tokens.jsonl
      - name: Train
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python train.py --tokens tokens.jsonl --epochs ${{ github.event.inputs.epochs }} --block ${{ github.event.inputs.block }} --d-model ${{ github.event.inputs.d_model }} --batch 16 --out checkpoints
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-output
          path: checkpoints/best.pt
          retention-days: 30
      - name: Commit model
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'GitHub Actions'
          mkdir -p models
          cp checkpoints/best.pt models/best.pt
          git add models/best.pt || true
          git commit -m 'Update model [skip ci]' || echo 'no changes'
          git push || echo 'no push'