name: Train From Scratch
on:
  workflow_dispatch:
    inputs:
      midi_count:
        description: 'MIDIs auto-gerados'
        default: '2000'
      epochs:
        description: 'Epocas'
        default: '40'
      block:
        description: 'Block size'
        default: '512'
      augment:
        description: 'Augmentar? (true/false)'
        default: 'true'
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install system
        run: sudo apt-get update && sudo apt-get install -y fluidsynth ffmpeg
      - name: Install python
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Self-gen MIDI
        run: python self_gen.py --out training_data/midi --count ${{ github.event.inputs.midi_count }} --bars 8
      - name: Augment
        if: ${{ github.event.inputs.augment == 'true' }}
        run: python augment.py --src training_data/midi music_input --out training_data/augmented --steps 6
      - name: Tokenize
        run: |
          if [ -d training_data/augmented ]; then python dataset.py --midi training_data/augmented --out tokens.jsonl; else python dataset.py --midi training_data/midi --out tokens.jsonl; fi
      - name: Train
        env:
          PYTHONUNBUFFERED: 1
        run: python train.py --tokens tokens.jsonl --epochs ${{ github.event.inputs.epochs }} --block ${{ github.event.inputs.block }} --batch 24 --out checkpoints
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: model
          path: checkpoints/best.pt
      - name: Commit
        run: |
          git config user.email 'actions@github.com'
          git config user.name 'Actions'
          mkdir -p models
          cp checkpoints/best.pt models/best.pt
          git add models/best.pt || true
          git commit -m 'Model update [skip ci]' || echo 'no changes'
          git push || echo 'no push'